
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Code Editor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #4f46e5, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4, transparent 35%),
                linear-gradient(135deg, #0f172a, #111827);

            color: white;
            padding: 25px;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            margin-bottom: 20px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);

            font-size: 25px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .logo h1 {
            font-size: 24px;
        }

        .logo p {
            color: #cbd5e1;
            font-size: 13px;
            margin-top: 3px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 10px;

            color: white;
            background: rgba(255, 255, 255, 0.1);

            cursor: pointer;
            font-size: 14px;
            font-weight: 600;

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.2);
        }

        .run-btn {
            background: linear-gradient(135deg, #6366f1, #06b6d4);
        }

        .run-btn:hover {
            box-shadow: 0 8px 25px rgba(6, 182, 212, 0.35);
        }

        /* Editor Card */
        .editor-card {
            overflow: hidden;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(15px);
        }

        /* Browser Bar */
        .browser-bar {
            height: 55px;

            display: flex;
            align-items: center;

            padding: 0 20px;

            background: rgba(0, 0, 0, 0.25);

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dots {
            display: flex;
            gap: 7px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot1 {
            background: #ff5f57;
        }

        .dot2 {
            background: #febc2e;
        }

        .dot3 {
            background: #28c840;
        }

        .address {
            flex: 1;
            margin-left: 20px;

            padding: 8px 15px;

            border-radius: 8px;

            background: rgba(255, 255, 255, 0.08);

            color: #94a3b8;
            font-size: 13px;
        }

        /* Iframe */
        .iframe-container {
            width: 100%;
            height: 75vh;
            min-height: 600px;
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 18px;
            color: #94a3b8;
            font-size: 13px;
        }

        .footer span {
            color: #67e8f9;
        }

        /* Responsive */
        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .header {
                padding: 15px;
            }

            .logo h1 {
                font-size: 18px;
            }

            .logo p {
                display: none;
            }

            .buttons .btn {
                padding: 9px 11px;
                font-size: 12px;
            }

            .browser-bar {
                height: 45px;
            }

            .iframe-container {
                height: 80vh;
                min-height: 500px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">

            <div class="logo">

                <div class="logo-icon">
                    &lt;/&gt;
                </div>

                <div>
                    <h1>Code Studio</h1>
                    <p>Write • Run • Experiment</p>
                </div>

            </div>

            <div class="buttons">

                <button class="btn" onclick="goFullScreen()">
                    ⛶ Fullscreen
                </button>

                <button class="btn run-btn" onclick="reloadEditor()">
                    ▶ Run
                </button>

            </div>

        </header>


        <!-- Editor -->
        <section class="editor-card">

            <!-- Browser Style Bar -->
            <div class="browser-bar">

                <div class="dots">
                    <span class="dot dot1"></span>
                    <span class="dot dot2"></span>
                    <span class="dot dot3"></span>
                </div>

                <div class="address">
                    🔒 onecompiler.com / online-editor
                </div>

            </div>


            <!-- OneCompiler -->
            <div class="iframe-container" id="editor">

                <iframe
                    id="compiler"
                    src="https://onecompiler.com/embed/?listenToEvents=true"
                    allowfullscreen>
                </iframe>

            </div>

        </section>


        <!-- Footer -->
        <footer class="footer">
             <span>code with fun,Made by Madanu Anoop</span>
        </footer>

    </div>


    <script>

        // Reload compiler
        function reloadEditor() {

            const iframe = document.getElementById("compiler");

            iframe.src = iframe.src;

        }


        // Fullscreen
        function goFullScreen() {

            const editor = document.getElementById("editor");

            if (editor.requestFullscreen) {
                editor.requestFullscreen();
            }

        }

    </script>

</body>
</html>
